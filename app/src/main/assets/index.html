<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Math Merge</title>
<meta name="theme-color" content="#14141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Merge">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#14141f;--panel:#232336;--panel2:#2d2d45;--text:#fff;--muted:#9aa0b8;--good:#2ee59d;--bad:#ff6b85;--gold:#ffc300}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- menu ---------- */
#menu{align-items:stretch;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));gap:10px;overflow-y:auto}
h1{font-size:46px;font-weight:900;text-align:center;line-height:1.05;margin-top:4px;
  background:linear-gradient(90deg,#ffc300,#ff4d6d 50%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{text-align:center;color:var(--muted);font-weight:700;letter-spacing:2px;font-size:14px;margin-bottom:4px}
.section-title{font-size:15px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:8px}
.choices{display:grid;gap:10px}
.ops{grid-template-columns:repeat(3,1fr)}
.choice{background:var(--panel);border:3px solid transparent;border-radius:18px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:10px}
.choice.sel{border-color:var(--gold);background:var(--panel2)}
.choice .big{font-size:22px;font-weight:900;line-height:1.1}
.choice .small{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:4px;margin-left:auto}
.chip{min-width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;padding:0 4px}
.op{flex-direction:column;align-items:center;text-align:center;padding:10px 4px;gap:2px}
.op .sym{font-size:40px;font-weight:900;line-height:1}
.op .name{font-size:15px;font-weight:800}
.op .lvl{font-size:12px;color:var(--muted);font-weight:700}
.bestline{color:var(--muted);font-size:15px;text-align:center;min-height:20px;font-weight:700;margin-top:4px}
#playBtn{font-size:30px;font-weight:900;color:#2b1d00;background:linear-gradient(180deg,#ffd84d,#ffaa00);border:none;border-radius:20px;padding:14px;box-shadow:0 6px 0 #b06e00}
#playBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b06e00}
.toggles{display:flex;gap:10px;margin-top:6px}
#updateBtn{font-size:18px;font-weight:900;color:#06281b;background:linear-gradient(180deg,#5cf2b4,#22c98a);border:none;border-radius:16px;padding:12px;box-shadow:0 4px 0 #128a5c}
.buildno{text-align:center;color:#5d6280;font-size:12px;font-weight:700;margin-top:4px}
.tog{flex:1;background:var(--panel);border:none;border-radius:14px;padding:12px 6px;font-size:14px;font-weight:800;color:var(--muted)}
.tog.on{color:#fff;background:var(--panel2)}

/* ---------- game ---------- */
#game{padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.topbar{display:flex;align-items:center;gap:8px}
.iconbtn{width:50px;height:50px;border-radius:14px;border:none;background:var(--panel);font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active,.bigbtn:active{transform:scale(.94)}
.modeLabel{flex:1;text-align:center;font-weight:900;font-size:19px;line-height:1.15}
.modeLabel small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.ladder{display:flex;gap:4px;justify-content:center;align-items:center;margin:10px 0 2px;min-height:46px;overflow:hidden}
.rung{min-width:46px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;padding:0 6px;background:#33334a;color:#8a8fa8;flex:none}
.rung.goal{background:transparent;border:3px dashed var(--gold);color:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.arrow{color:#5d6280;font-weight:900;font-size:18px}
@keyframes pulse{50%{transform:scale(1.08)}}
.equation{height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:none}
#eq{font-size:34px;font-weight:900;white-space:nowrap;line-height:1.1}
#eq.good{color:var(--good)} #eq.bad{color:var(--bad)} #eq.idle{color:var(--gold)}
#eqNote{font-size:15px;color:var(--muted);font-weight:700;min-height:19px;margin-top:2px}
.boardWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{position:relative;touch-action:none;overflow:hidden;border-radius:14px}
#line{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
.tile{position:absolute;left:0;top:0;transition:transform .24s cubic-bezier(.34,1.35,.64,1),opacity .2s;z-index:1;will-change:transform}
.face{width:100%;height:100%;border-radius:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.face b{line-height:1;font-weight:900}
.face i{font-style:normal;font-weight:800;opacity:.8;line-height:1;margin-top:3px}
.face.helper{box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.12)}
.face.lad{box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),inset 0 -5px 0 rgba(0,0,0,.22)}
.face.sel{box-shadow:0 0 0 4px #fff,inset 0 -5px 0 rgba(0,0,0,.22)}
.face.pop{animation:pop .36s ease}
.face.wob{animation:wob .38s}
.face.hint{animation:glow .6s ease-in-out 4}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.12);box-shadow:0 0 0 5px #fff,0 0 22px 8px #ffe066}}
.bottombar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;flex:none}
.bigbtn{background:var(--panel);border:none;border-radius:16px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1}
.bigbtn span{font-size:12px;font-weight:800;color:var(--muted);margin-top:4px}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:20;
  background:rgba(20,20,31,.92);border:3px solid var(--gold);border-radius:22px;padding:14px 22px;text-align:center;transition:all .25s cubic-bezier(.34,1.4,.64,1);min-width:220px}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .t1{font-size:30px;font-weight:900;color:var(--gold)}
#toast .t2{font-size:17px;font-weight:800;color:#fff;margin-top:4px}

/* ---------- learn screens ---------- */
#learn{padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));gap:10px}
.starpill{height:50px;padding:0 12px;border-radius:14px;background:var(--panel);display:flex;align-items:center;font-weight:900;font-size:18px;color:var(--gold);flex:none}
.stages{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stg{height:36px;padding:0 10px;border-radius:10px;border:2px solid transparent;background:var(--panel);color:var(--muted);font-weight:800;font-size:13px}
.stg.done{color:var(--good)}
.stg.now{border:2px dashed var(--gold);color:var(--gold);background:transparent}
.lbody{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.lcard{background:var(--panel);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lq{font-size:21px;font-weight:900;text-align:center}
.lsub{font-size:15px;font-weight:800;color:var(--muted)}
.lcap{font-size:14px;font-weight:700;color:var(--muted);text-align:center;min-height:17px}
.lbig{font-weight:900;line-height:1;white-space:nowrap}
.lfound{font-size:16px;font-weight:900;color:var(--gold);text-align:center}
.chs{display:grid;gap:10px}
.chs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ch{min-height:62px;border-radius:18px;border:3px solid transparent;background:var(--panel);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;gap:4px;white-space:nowrap}
.ch.pic{min-height:150px}
.ch.right{border-color:var(--good);background:#11382b}
.ch.wrong{border-color:var(--bad);background:#3a1520;opacity:.75}
.ch.dim{opacity:.25}
.ch.hl{border-color:var(--gold);animation:pulse 1s ease-in-out infinite}
.pcap{font-size:12px;font-weight:800;color:var(--muted)}
.lsteps{display:flex;align-items:center;gap:6px}
.lstep{flex:1;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;background:var(--panel);color:#5d6280;border:3px solid transparent}
.lstep.done{background:#11382b;border-color:var(--good);color:#fff}
.lstep.now{background:transparent;border:3px dashed var(--gold);color:var(--gold);font-size:15px}
.larr{color:#5d6280;font-weight:900;font-size:22px}
.nmain{font-size:30px;font-weight:900;line-height:1.1}
.nsub{font-size:15px;font-weight:800;color:var(--muted);white-space:normal;text-align:center}
.celebrate{display:flex;align-items:center;justify-content:center;gap:12px;animation:pop .55s ease;min-height:46px}
.praise{font-size:34px;font-weight:900;color:var(--gold)}
.plus{font-size:20px;font-weight:900;color:var(--gold);background:var(--panel2);border-radius:12px;padding:5px 10px;animation:pulse 1s ease-in-out 2}
.xcard{gap:8px}
.xtitle{font-size:26px;font-weight:900;color:var(--good)}
.xsteps{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.xstep{opacity:0;font-size:18px;font-weight:800;text-align:center;line-height:1.3;animation:stepIn .45s ease forwards}
.xstep.big{font-size:26px;font-weight:900;color:#fff;background:#11382b;border:2px solid var(--good);border-radius:14px;padding:6px 14px}
@keyframes stepIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nextbtn{opacity:0;animation:stepIn .4s ease forwards;flex:none;height:62px;border:none;border-radius:20px;background:linear-gradient(180deg,#ffd84d,#ffaa00);color:#2b1d00;font-size:26px;font-weight:900;box-shadow:0 6px 0 #b06e00}
.nextbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b06e00}
.lfb.bad{background:#3a1520;border-color:var(--bad)}
.lfb{background:#11382b;border:2px solid var(--good);border-radius:18px;padding:12px 14px;font-size:16px;font-weight:800;line-height:1.35}
.ruled{display:grid;grid-template-columns:auto auto;gap:6px;align-items:center}
.rtop{position:relative;height:26px;display:flex;align-items:center;justify-content:center}
.rtop::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid #9aa0b8}
.rtop::after{content:'';position:absolute;left:0;right:0;top:4px;bottom:4px;border-left:2px solid #9aa0b8;border-right:2px solid #9aa0b8}
.rleft{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center;min-width:34px}
.rleft::before{content:'';position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #9aa0b8}
.rleft::after{content:'';position:absolute;top:0;bottom:0;left:25%;right:25%;border-top:2px solid #9aa0b8;border-bottom:2px solid #9aa0b8}
.rtop span,.rleft span{position:relative;z-index:1;background:var(--panel);padding:2px 5px;font-size:19px;font-weight:900;color:#fff;line-height:1}
.dots{display:grid}
.dots i{display:block;border-radius:30%}
.blocks{display:grid}
.blocks div{border-radius:14%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#06203f;background:#3a86ff;box-shadow:inset 0 0 0 2px #a9cbff}
.bottombar.two{grid-template-columns:repeat(2,1fr)}
.op .desc{font-size:11px;color:var(--muted);font-weight:700;line-height:1.2}

/* ---------- overlay ---------- */
.overlay{position:absolute;inset:0;background:rgba(8,8,14,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.card{background:var(--panel);border-radius:24px;padding:22px 20px;max-width:420px;width:100%;text-align:center}
.card h2{font-size:28px;font-weight:900;margin-bottom:12px}
.card p{font-size:18px;font-weight:700;line-height:1.35;margin:10px 0;text-align:left}
.card .ex{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.card .ex div{background:var(--bg);border-radius:12px;padding:8px;font-size:24px;font-weight:900;color:var(--good)}
.card .row{display:flex;gap:10px;margin-top:14px}
.card .row button{flex:1;border:none;border-radius:16px;padding:14px;font-size:22px;font-weight:900}
.btn-yes{background:linear-gradient(180deg,#ffd84d,#ffaa00);color:#2b1d00}
.btn-no{background:var(--panel2)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.conf{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
</style>
</head>
<body>

<div id="menu" class="screen active">
  <h1>Math Merge</h1>
  <div class="tag">SLIDE · ADD · MERGE</div>
  <div class="section-title">1. Pick a level</div>
  <div class="choices" id="ladderChoices"></div>
  <div class="section-title">2. Pick your math</div>
  <div class="choices ops" id="opChoices"></div>
  <div class="section-title" id="learnTitle">…or learn the shape</div>
  <div class="choices ops" id="learnChoices"></div>
  <div class="bestline" id="bestLine"></div>
  <button id="updateBtn" style="display:none"></button>
  <button id="playBtn">Play</button>
  <div class="toggles">
    <button class="tog" id="togVoice"></button>
    <button class="tog" id="togSound"></button>
  </div>
  <div class="buildno" id="buildNo"></div>
</div>

<div id="game" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="homeBtn" aria-label="Home">🏠</button>
    <div class="modeLabel" id="modeLabel"></div>
    <button class="iconbtn" id="voiceBtn" aria-label="Voice">🔊</button>
  </div>
  <div class="ladder" id="ladder"></div>
  <div class="equation"><div id="eq"></div><div id="eqNote"></div></div>
  <div class="boardWrap" id="boardWrap"><div id="board"><svg id="line"></svg></div></div>
  <div class="bottombar">
    <button class="bigbtn" id="hintBtn">💡<span>Hint</span></button>
    <button class="bigbtn" id="shuffleBtn">🔀<span>Shuffle</span></button>
    <button class="bigbtn" id="helpBtn">❓<span>How to</span></button>
    <button class="bigbtn" id="newBtn">🔄<span>New game</span></button>
  </div>
</div>

<div id="learn" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="lHome" aria-label="Home">🏠</button>
    <div class="modeLabel" id="lLabel"></div>
    <div class="starpill" id="lStars"></div>
  </div>
  <div class="stages" id="lStages"></div>
  <div class="lbody" id="lBody"></div>
  <div class="bottombar two">
    <button class="bigbtn" id="lHint">💡<span>Hint</span></button>
    <button class="bigbtn" id="lSay">🔊<span>Say it</span></button>
  </div>
</div>
<div id="toast"><div class="t1"></div><div class="t2"></div></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<div id="fx"></div>

<script>
'use strict';
/* ============================================================
   Math Merge — chain-merge number game for little kids.
   Level  = which "ladder" of numbers you build (doubling / squares / cubes / tens)
   Math   = how a chain combines (add / take away / times)
   A chain merges only if its answer is a number on the ladder.
   All numbers are BigInt, so they stay exact all the way up to a googol (10^100).
   ============================================================ */
const COLS = 5, ROWS = 7, N = COLS * ROWS;
const PALETTE = ['#ff4d6d','#3a86ff','#ffc300','#8b5cf6','#06b67f','#fb5607','#00a8cc','#d63ad1','#7cc242','#e5383b','#4361ee','#ff9f1c','#2ec4b6','#b5179e'];
const HELPER = '#4a5372';
const $ = s => document.querySelector(s);
const B = BigInt;
const GOOGOL = 10n ** 100n;
const BIG = 100000n;      // from here on, numbers show as 10ⁿ
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(d => SUP[+d]).join('');
const digits = v => v.toString().length;
const bitlen = v => v.toString(2).length;
const isPow10 = v => v >= 1n && /^10*$/.test(v.toString());

// floor of the k-th root of a BigInt
function iroot(n, k) {
  if (n < 2n) return n;
  const K = B(k);
  let x;
  if (n < 2n ** 100n) {
    x = B(Math.floor(Math.pow(Number(n), 1 / k)));
  } else {
    x = 1n << B(Math.ceil(bitlen(n) / k));
    for (;;) { const y = ((K - 1n) * x + n / (x ** (K - 1n))) / K; if (y >= x) break; x = y; }
  }
  while (x > 0n && x ** K > n) x--;
  while ((x + 1n) ** K <= n) x++;
  return x;
}

/* ---------- big number names ---------- */
const ILLIONS = ['', 'thousand', 'million', 'billion', 'trillion', 'quadrillion', 'quintillion', 'sextillion', 'septillion',
  'octillion', 'nonillion', 'decillion', 'undecillion', 'duodecillion', 'tredecillion', 'quattuordecillion', 'quindecillion',
  'sexdecillion', 'septendecillion', 'octodecillion', 'novemdecillion', 'vigintillion'];
function sci(v) { // 2 significant digits: [mantissa string, exponent]
  const s = v.toString(), e = s.length - 1;
  if (/^[1-9]0*$/.test(s)) return [s[0], e];   // exact: 9×10¹⁵ (not 9.0×10¹⁵)
  let m = Math.round(Number(s.slice(0, 3).padEnd(3, '0')) / 10), ee = e;
  if (m >= 100) { m = 10; ee = e + 1; }
  return [(m / 10).toFixed(1), ee];
}
function fmt(v) {
  if (v < 0n) return '−' + fmt(-v);
  const s = v.toString();
  if (s.length <= 5) return s;
  const [m, e] = sci(v);   // 1×10²⁵ (not 10²⁵) so it lines up with its partner 9×10²⁵
  return `${m}×10${sup(e)}`;
}
// Name a number in words: "one tredecillion", "about 1.4 tredecillion", "a googol"
function nameOf(v, spoken) {
  if (v < 0n) return 'minus ' + nameOf(-v, spoken);
  if (v < 1000000n) return v.toString();
  if (v === GOOGOL) return 'a googol';
  const s = v.toString(), e = s.length - 1, g = Math.floor(e / 3);
  if (g < ILLIONS.length) {
    const leadLen = e - g * 3 + 1, lead = s.slice(0, leadLen), rest = s.slice(leadLen);
    if (/^0*$/.test(rest)) return `${lead === '1' ? 'one' : lead} ${ILLIONS[g]}`;
    let x = (Number(s.slice(0, leadLen + 2)) / 100).toFixed(1).replace(/\.0$/, '');
    if (spoken) x = x.replace('.', ' point ');
    return `about ${x} ${ILLIONS[g]}`;
  }
  if (isPow10(v)) return spoken ? `ten to the ${e}` : `10${sup(e)}`;
  const [m, ee] = sci(v);
  return spoken ? `about ${m} times ten to the ${ee}` : `about ${m}×10${sup(ee)}`;
}
const sayNum = v => nameOf(v, true);
// Count ZEROS, not digits: a million is "a 1 with 6 zeros".
const zerosLine = v => { const e = digits(v) - 1; return isPow10(v) ? `a 1 with ${e} zeros` : `bigger than a 1 with ${e} zeros`; };

/* ---------- ladders ---------- */
const LADDERS = {
  doubling: {
    title: 'Doubling', kind: 'doubling number', blurb: 'Each one is double the last',
    val: i => 2n ** B(i + 1),
    is: v => v >= 2n && (v & (v - 1n)) === 0n,
    idx: v => v < 2n ? -1 : bitlen(v) - 2,
    next: v => v < 2n ? 2n : 1n << B(bitlen(v)),
    cap: v => v < 4n ? '' : v <= 512n ? `${v / 2n}+${v / 2n}` : '2' + sup(bitlen(v) - 1),
    say: v => v >= 4n && v < 1000000n ? `That's ${v / 2n} plus ${v / 2n}.` : ''
  },
  squares: {
    title: 'Squares', kind: 'square number', blurb: 'A number times itself',
    val: i => B(i + 1) ** 2n,

/* ---------------- sound + voice ---------------- */
let AC = null;
function audio() {
  if (!store.sound) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f, d = 0.09, type = 'sine', vol = 0.12, delay = 0) {
  const ac = audio(); if (!ac || !isFinite(f)) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + d + 0.03);
}
const STEPS = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const sfxStep = n => tone(330 * 2 ** (STEPS[Math.min(n, STEPS.length - 1)] / 12), 0.1, 'triangle', 0.12);
const sfxMerge = () => [0, 4, 7, 12].forEach((s, k) => tone(523 * 2 ** (s / 12), 0.16, 'triangle', 0.12, k * 0.055));
const sfxBad = () => { tone(196, 0.16, 'square', 0.035); tone(165, 0.22, 'square', 0.035, 0.12); };
const sfxStar = () => [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => tone(659 * 2 ** (s / 12), 0.18, 'sine', 0.11, k * 0.07));
const sfxShuffle = () => [0, 3, 6, 9].forEach((s, k) => tone(440 * 2 ** (s / 12), 0.06, 'sine', 0.07, k * 0.04));
function say(text) {
  if (!store.voice) return;
  try {
    if (window.Android && window.Android.speak) { window.Android.speak(text); return; }
    if ('speechSynthesis' in window) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95; u.pitch = 1.1;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
}
function buzz(ms) { try { if (window.Android && window.Android.vibrate) window.Android.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------------- input ---------------- */
function localPt(e) { const b = board.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
function idxAt(x, y, strict) {
  const c = Math.floor(x / cell), r = Math.floor(y / cell);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  if (strict) {
    const dx = x - (c + 0.5) * cell, dy = y - (r + 0.5) * cell;
    if (dx * dx + dy * dy > (cell * 0.44) ** 2) return -1;
  }
  return r * COLS + c;
}
function chainChanged() { render(); drawChain(); showEq(); }
function handlePoint(p) {
  const i = idxAt(p.x, p.y, true);
  if (i < 0 || !G.grid[i]) return;
  const pos = chain.indexOf(i);
  if (pos === chain.length - 1) return;
  if (pos >= 0 && pos === chain.length - 2) { chain.pop(); sfxStep(chain.length - 1); chainChanged(); return; }
  if (pos === -1 && adjacent(i, chain[chain.length - 1])) {
    if (!canExtend(chainVals(), G.grid[i].v)) {   // not the next doubling: tile wobbles, chain doesn't grow
      if (lastBlocked !== i) { lastBlocked = i; retrigger(tiles.get(G.grid[i].id).firstChild, 'wob'); tone(200, 0.08, 'square', 0.03); }
      return;
    }
    lastBlocked = -1;
    chain.push(i); sfxStep(chain.length - 1); chainChanged();
  }
}
let lastBlocked = -1;
board.addEventListener('pointerdown', e => {
  if (busy || chain.length) return;
  audio();
  const p = localPt(e), i = idxAt(p.x, p.y, false);
  if (i < 0 || !G.grid[i]) return;
  try { board.setPointerCapture(e.pointerId); } catch (_) {}
  clearHint();
  eqHoldUntil = 0;
  chain = [i]; lastPt = p; lastBlocked = -1;
  sfxStep(0); chainChanged();
});
board.addEventListener('pointermove', e => {
  if (!chain.length) return;
  const p = localPt(e);
  const dx = p.x - lastPt.x, dy = p.y - lastPt.y;
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (cell / 6)));
  for (let k = 1; k <= steps; k++) handlePoint({ x: lastPt.x + dx * k / steps, y: lastPt.y + dy * k / steps });
  lastPt = p;
});
board.addEventListener('pointerup', () => finishChain());
board.addEventListener('pointercancel', () => finishChain());
document.addEventListener('contextmenu', e => e.preventDefault());

function finishChain() {
  if (!chain.length) return;
  const path = chain.slice();
  chain = [];
  if (path.length < 2) { chainChanged(); return; }
  const vals = path.map(i => G.grid[i].v), res = O().apply(vals);
  if (valid(res)) { merge(path, vals, res); return; }
  chainChanged();
  setEq(eqString(vals, res), 'bad', whyNot(res) + '. Try again!');
  eqHoldUntil = Date.now() + 1800;
  setTimeout(showEq, 1850);
  path.forEach(i => retrigger(tiles.get(G.grid[i].id).firstChild, 'wob'));
  sfxBad();
  say(whyNotSpoken(res) + '. Try again.');
}

// Long chains get a short summary instead of "1 plus 1 plus 1 plus…"
const COUNT_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen'];
const UNIT_NAMES = { '1': 'ones', '10': 'tens', '100': 'hundreds', '1000': 'thousands' };
function longChainSpeech(vals, res) {
  const n = vals.length, cw = COUNT_WORDS[n] || String(n), Cw = cw[0].toUpperCase() + cw.slice(1);
  if (allSame(vals)) {
    if (store.op === 'add') {
      const unit = UNIT_NAMES[vals[0].toString()];
      return unit ? `${Cw} ${unit} make ${sayNum(res)}.` : `${Cw} times ${sayNum(vals[0])} makes ${sayNum(res)}.`;
    }
    if (store.op === 'mul') return `${sayNum(vals[0])}, ${n} times over, makes ${sayNum(res)}.`;
  }
  return `That makes ${sayNum(res)}!`;
}

function gravity() {
  for (let c = 0; c < COLS; c++) {
    const col = [];
    for (let r = ROWS - 1; r >= 0; r--) { const t = G.grid[r * COLS + c]; if (t) col.push(t); }
    const missing = ROWS - col.length;
    for (let r = ROWS - 1, k = 0; r >= 0; r--, k++) G.grid[r * COLS + c] = k < col.length ? col[k] : null;
    for (let r = missing - 1; r >= 0; r--) {
      const t = newTile(spawnValue());
      t.spawnRow = r - missing;
      G.grid[r * COLS + c] = t;
    }
  }
}

// Decide how to celebrate a new best number.
function celebration(oldBest, res) {
  if (res >= GOOGOL) return { kind: 'googol' };
  if (res <= oldBest) return null;
  if (res < BIG) return { kind: 'step' };
  const ne = digits(res) - 1, oe = oldBest > 0n ? digits(oldBest) - 1 : 0;
  if (ne >= 6 && ne < 66 && Math.floor(ne / 3) > Math.floor(oe / 3)) return { kind: 'name', word: ILLIONS[Math.floor(ne / 3)], e: ne };
  if (ne >= 66 && Math.floor(ne / 10) > Math.floor(oe / 10)) return { kind: 'power', e: ne };
  return null;
}

async function merge(path, vals, res) {
  busy = true;
  const last = path[path.length - 1], [lr, lc] = rc(last);
  const party = celebration(G.best, res);
  const isNew = res > G.best;
  setEq(eqString(vals, res), 'good', party ? `⭐ New: ${fmt(res)}! ⭐` : (res >= 1000000n ? nameOf(res) : 'Great job!'));
  eqHoldUntil = Date.now() + 1500;
  setTimeout(showEq, 1550);
  sfxMerge(); buzz(25);
  const small = res < 1000000n && vals.every(v => v < 1000000n);
  let speech = vals.length > 3 ? longChainSpeech(vals, res)
    : small ? vals.map(String).join(` ${O().word} `) + ` equals ${res}.` : `${sayNum(res)}!`;
  if (party && party.kind === 'step') speech += ` Wow! You made ${res}! ` + L().say(res);
  if (party && (party.kind === 'name' || party.kind === 'power'))
    speech = `Wow! You made ${sayNum(res)}! That's ${zerosLine(res)}!`;
  if (party && party.kind === 'googol') speech = `A googol! That's a one with a hundred zeros! You reached the top!`;
  say(speech);
  drawChain();
  render(); // un-highlight
  for (const i of path.slice(0, -1)) { const el = tiles.get(G.grid[i].id); posEl(el, lr, lc, 0.4); el.style.opacity = '0'; el.style.zIndex = '0'; }
  await sleep(190);
  path.slice(0, -1).forEach(i => { G.grid[i] = null; });
  G.grid[last].v = res;
  if (isNew) G.best = res;
  const prevBest = store.best[modeKey()] ? B(store.best[modeKey()]) : 0n;
  if (res > prevBest) store.best[modeKey()] = res.toString();
  render();
  retrigger(tiles.get(G.grid[last].id).firstChild, 'pop');
  await sleep(150);
  if (sameN() && !(party && party.kind === 'googol')) {
    await sleep(380);
    const el = tiles.get(G.grid[last].id);
    el.style.transition = 'transform .45s ease-in, opacity .45s';
    posEl(el, -2, lc, 0.5); el.style.opacity = '0';
    tone(1046, 0.1, 'sine', 0.08);
    await sleep(380);
    G.grid[last] = null;
  }
  if (party && party.kind === 'googol') {
    store.trophies[modeKey()] = (store.trophies[modeKey()] || 0) + 1;
    confetti(120); sfxStar();
    toast('🏆 GOOGOL! 🏆', '10¹⁰⁰ — a 1 with 100 zeros!', 3000);
    await sleep(900);
    const el = tiles.get(G.grid[last].id);
    posEl(el, lr, lc, 1.8); el.style.opacity = '0';
    await sleep(300);
    G.grid[last] = null;
  }
  const floor = staleBelow();
  if (floor) {
    const stale = [];
    G.grid.forEach((t, i) => { if (t && t.v < floor) stale.push(i); });
    if (stale.length) {
      stats.cleared += stale.length;
      for (const i of stale) { const [r, c] = rc(i), el = tiles.get(G.grid[i].id); posEl(el, r, c, 0.2); el.style.opacity = '0'; }
      tone(880, 0.12, 'sine', 0.08); tone(1320, 0.12, 'sine', 0.06, 0.06);
      await sleep(260);
      stale.forEach(i => { G.grid[i] = null; });
    }
  }
  gravity(); render();
  await sleep(320);
  updateHUD();
  if (party && party.kind === 'step') {
    confetti(); sfxStar();
    const cap = L().cap(res);
    toast(`You made ${fmt(res)}!`, cap ? `${cap} = ${fmt(res)}` : '⭐', 1700);
  } else if (party && party.kind === 'name') {
    confetti(90); sfxStar();
    toast(`${party.word.toUpperCase()}!`, `${fmt(res)} = ${zerosLine(res)}!`, 2600);
  } else if (party && party.kind === 'power') {
    confetti(90); sfxStar();
    toast(`10${sup(party.e)}!`, `That's ${zerosLine(res)}!`, 2400);
  }
  if (!findMove()) {
    await sleep(party ? 1400 : 300);
    stats.autoShuffles++;
    toast('No moves!', 'Shuffling…', 1200);
    await sleep(500);
    await shuffleBoard(true);
  }
  save();
  busy = false;
}

/* ================= LEARN THE SHAPE: See it / Link it / Name it (squares & cubes) ================= */
const LEARN = {
  see:  { title: 'See it',  desc: 'Picture → number' },
  link: { title: 'Link it', desc: 'Number → picture → name' },
  name: { title: 'Name it', desc: 'Which power is it?' }
};
const isLearn = op => !!LEARN[op];
const STAGES = {
  squares: [{ label: '1²–10²', lo: 2, hi: 10 }, { label: '11²–20²', lo: 11, hi: 20 }, { label: '21²–30²', lo: 21, hi: 30 },
            { label: '31²–50²', lo: 31, hi: 50 }, { label: '30², 300²…', tens: true, kMax: 6 }],
  cubes:   [{ label: '1³–10³', lo: 2, hi: 10 }, { label: '11³–20³', lo: 11, hi: 20 }, { label: '21³–30³', lo: 21, hi: 30 },
            { label: '30³, 300³…', tens: true, kMax: 5 }]
};
const STAGE_GOAL = 10;          // first-try answers to tick a stage ✓
let LQ = null;                   // the current question
const PW = () => store.ladder === 'cubes' ? 3 : 2;
const PS = p => p === 3 ? '³' : p === 2 ? '²' : sup(p);
const shuf = a => { a = a.slice(); shuffleArr(a); return a; };
function lstate() {
  store.learn2 = store.learn2 || {};
  const k = modeKey();
  // start just past what he already knows: squares 21–30, cubes 11–20 (any range can be picked)
  if (!store.learn2[k]) store.learn2[k] = { stage: store.ladder === 'cubes' ? 1 : 2, stars: 0, done: {}, facts: {} };
  const ls = store.learn2[k];
  if (!STAGES[store.ladder][ls.stage]) ls.stage = 0;
  return ls;
}
const factKey = f => f.a + 'e' + f.k;
const sciAll = v => { if (v < 10n) return v.toString(); const [m, e] = sci(v); return `${m}×10${sup(e)}`; };
const baseLbl = (a, k) => k ? (a === 1 ? '10' + sup(k) : `${a}×10${sup(k)}`) : String(a);
const wrapB = s => (s.includes('×') || /[⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(s)) ? `(${s})` : s;   // (10¹)³, not 10¹³
const powLbl = (a, k, p) => wrapB(baseLbl(a, k)) + PS(p);
const coefLbl = (coef, e) => `${coef}×10${sup(e)}`;
const valLbl = (f, v) => f.k ? coefLbl(B(f.a) ** B(f.p), f.p * f.k) : fmt(v);
const sayBase = f => f.k ? `${f.a} times ten to the ${f.k}` : String(f.a);
const timesWord = p => p === 2 ? 'double' : 'triple';

      add(`${t / 10} × ${t / 10} = ${(t / 10) ** 2}, add two zeros`, null, BLUE);

  const L2 = a * a;

  add(`${a} layers of ${L2}`);
  if (splitOK) {

    add(`${r} ${layW(r)} = ${r * L2}`, `${r} ${layW(r)} is ${r * L2}.`, GREEN);

function finishQ() {

  ls.facts[key] = s; persist();
  learnStreak = LQ.first ? learnStreak + 1 : 0;
  const praise = learnStreak >= 3 && learnStreak % 3 === 0 ? `${learnStreak} in a row!` : LQ.first ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : 'You got it!';
  const steps = whySteps(f);

  if (LQ.first) { setTimeout(sfxStar, 250); confetti(learnStreak >= 3 ? 70 : 34); }

}
function learnHint() {
  if (!LQ || LQ.busy) return;
  const wrong = LQ.choices.filter(c => !c.right && !c.state);
  if (wrong.length > 1) { wrong[Math.floor(Math.random() * wrong.length)].state = 'dim'; LQ.first = false; renderLearn(); }
  const f = LQ.f;
  const a = f.a;
  say(f.k ? `Multiply the front numbers, then ${timesWord(f.p)} the zeros.`
    : f.p === 2 ? `Think ${a} lots of ${a}.` + (a > 10 ? ` Ten lots of ${a} is ${10 * a}.` : '')

$('#lHome').onclick = () => goMenu();

buildMenu();

// Android app only: show the build number and offer newer builds from GitHub Releases.
(function updates() {
  const A = window.Android;
  if (!A || !A.buildNumber) return;
  let mine = 0;
  try { mine = A.buildNumber(); } catch (e) { return; }
  $('#buildNo').textContent = `Build ${mine}`;
  window.onUpdateInfo = info => {
    if (!info || !info.build || info.build <= mine || !info.url) return;
    const b = $('#updateBtn');
    b.textContent = `⬆️ New version! Tap to update (build ${info.build})`;
    b.style.display = '';
    b.onclick = () => {
      A.openUrl(info.url);
      b.textContent = '⬇️ Downloading… tap the file when done, then Update';
    };
  };
  try { A.checkUpdate(); } catch (e) {}
