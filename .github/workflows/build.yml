name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MathMerge.apk

      - name: Save APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathMerge-apk
          path: MathMerge.apk

      - name: Publish a Release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MathMerge.apk \
            --title "Math Merge (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap MathMerge.apk to download and install." \
            --latest
